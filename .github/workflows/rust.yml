name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the main repository along with its submodules
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        # Use 'true' to fetch top-level submodules, or 'recursive' if your submodules contain submodules
        submodules: recursive 
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
