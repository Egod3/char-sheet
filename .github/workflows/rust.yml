name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the main repository along with its submodules
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        # Use 'true' to fetch top-level submodules, or 'recursive' if your submodules contain submodules
        submodules: recursive 
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
          toolchain: [stable, beta, nightly]
    continue-on-error: ${{ matrix.toolchain == 'nightly' }}
    steps:
    # Step 1: Checkout the main repository along with its submodules
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        # Use 'true' to fetch top-level submodules, or 'recursive' if your submodules contain submodules
        submodules: recursive 
    # Step 2: Checkout the toolchain based on the above toolchain array
    - name: Checkout Toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        # Use 'true' to fetch top-level submodules, or 'recursive' if your submodules contain submodules
        toolchain: ${{ matrix.toolchain }}
    - name: Cargo Test
      run: cargo test --verbose --all-features
  
